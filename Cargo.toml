[package]
name = "mrkt"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
rand = "0.9.2"
rocket = { version = "0.5.1", features = ["json"] }
sqlx = { version = "0.8.6", features = [ "runtime-tokio", "sqlite", "macros", "migrate", "time" ] }
dotenvy = "0.15"
serde = "1.0.219"
argon2 = "0.5.3"
thiserror = "2.0.16"
time = { version = "0.3.43", features = ["serde"] }
