[package]
name = "mrkt"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.85"
base64 = "0.22.1"
rand = "0.9.2"
reqwest = { version = "0.12.9", features = ["json"] }
rocket = { version = "0.5.1", features = ["json"] }
sqlx = { version = "0.8.6", features = [ "runtime-tokio", "sqlite", "macros", "migrate", "time" ] }
dotenvy = "0.15"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.133"
argon2 = "0.5.3"
thiserror = "2.0.16"
time = { version = "0.3.43", features = ["serde"] }
maud = { version = "0.27.0", features = ["rocket"] }
url = "2.5.4"
